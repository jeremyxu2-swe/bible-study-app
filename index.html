  <meta name="theme-color" content="#14161B">
  <script>
    // Apply the saved theme and text size before the app loads, so there's no flash of the wrong colors.
    try {
      var t = localStorage.getItem('lamp-path-theme') || 'dark';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F1E7');
      var z = parseFloat(localStorage.getItem('lamp-path-text-size'));
      if (z >= 0.85 && z <= 1.35) document.documentElement.style.setProperty('--ts', z);
      if (localStorage.getItem('lamp-path-side-collapsed') === 'true') document.documentElement.classList.add('side-collapsed');
    } catch (e) { /* storage blocked: defaults apply */ }
  </script>
